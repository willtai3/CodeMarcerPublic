name: CI
on:
  pull_request:
  push:
    branches: [main]
# Read the code; write only issues and PR comments, which the failure report needs.
permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "Step 1: Check out the code"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: "Step 2: Set up Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.10" # matches the toolchain line in go.mod; earlier versions have known net/http and crypto fixes missing
          cache: false
      - name: "Step 3: Check Go formatting and vet"
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted: $unformatted"; exit 1; fi
          go vet ./...
      - name: "Step 4: Scan Go code and its standard library for known vulnerabilities"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        timeout-minutes: 8
      - name: "Step 5: Set up Node 22 (browser tests only)"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: "Step 6: Install test tools"
        run: npm ci --no-audit --no-fund # exact versions from package-lock.json
        timeout-minutes: 8
      - name: "Step 7: Install Chromium for browser tests"
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8
      - name: "Step 8: Build, then run Go, API, browser and scale tests"
        shell: bash # "bash" adds -o pipefail, so a failing test fails the step even through tee
        run: npm test 2>&1 | tee test-output.txt
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/report-failure.sh test test-output.txt
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Step 1: Check out the full history"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Step 2: Scan every commit for secrets"
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/report-failure.sh secrets
