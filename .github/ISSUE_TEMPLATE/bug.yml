name: Bug in the site's code
description: Something on the site or admin page doesn't work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Find an engineer\n2. Click Hire by the hour\n3. ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
